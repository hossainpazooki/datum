name: conformance

# The pack's own controls (DATUM rule 4 applied to DATUM), on every push.
# --mutate disables each rule in turn and requires a fixture to notice;
# --check-status compares STATUS.md's generated block with a fresh rendering
# (rule 5). No dependencies; Node 20 is the floor the design names.

on:
  push:
  pull_request:

jobs:
  pack:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: pack self-test with mutation
        run: node conformance/test.mjs --mutate
      - name: STATUS.md generated block is fresh
        run: node conformance/test.mjs --check-status
